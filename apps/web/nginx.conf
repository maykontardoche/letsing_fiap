server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Cabeçalhos de segurança do SPA.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Câmera e microfone só para a própria origem — são usados na verificação de identidade.
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # A API, na mesma origem: o cookie de sessão é first-party e o CORS nem entra em jogo.
  location /api/ {
    proxy_pass http://api:3020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
  }

  # Assets com hash no nome: cache longo e imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rotas do SPA caem no index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
